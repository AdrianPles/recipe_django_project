{% extends "recipes/base.html" %}

{% block title %}
Confirmă ștergerea rețetei
{% endblock %}

{% block content %}
<div class="recipe-delete">
    <p>Dorești ștergerea rețetei:</p>
    <p>"{{ recipe }}"?</p>
</div>

<div class="choices">
    <form method="post">
        {% csrf_token %}
        <button class="delete-choice" type="submit">Da</button>
    </form>
    <button class="delete-choice" onclick="window.location = '/'">Nu</button>
</div>
{% endblock %}
